[project]
name = "tenachat"
version = "0.1.0"
description = "TenaChat with Agentic RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- runtime serving ---
    "fastapi[standard]>=0.117.1",
    "uvicorn>=0.36.0",
    "openai>=1.51.0",
    "langchain>=1.2.11",
    "langchain-community>=0.3.29",
    "langchain-openai>=0.3.33",
    "langgraph>=0.6.7",
    "faiss-cpu>=1.12.0",
    "redis>=6.4.0",
    "supabase>=2.19.0",
    "sqlalchemy>=2.0.43",
    "loguru>=0.7.3",
    # --- indexing (canonical: OpenAI + pymupdf4llm) ---
    "pymupdf>=1.24.9",
    "pymupdf4llm>=1.27.2.1",
    # --- dev / test ---
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
